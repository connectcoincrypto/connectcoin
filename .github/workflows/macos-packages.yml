name: macOS installers

on:
  workflow_dispatch:
  push:
    branches: ['codex/macos-installers']
    paths:
      - '.github/workflows/macos-packages.yml'
      - 'contrib/macdeploy/**'
      - 'test/lint/lint-macos-package.py'
      - 'share/qt/Info.plist.in'
      - 'CMakeLists.txt'
      - 'depends/**'

permissions:
  contents: read

concurrency:
  group: macos-packages-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build and verify macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      CMAKE_BUILD_PARALLEL_LEVEL: '3'
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: '1'
      CCACHE_MAXSIZE: '384M'
      QT_RCC_SOURCE_DATE_OVERRIDE: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Test packaging helpers
        run: |
          python3 contrib/macdeploy/build_dmg.py --self-test
          python3 contrib/macdeploy/validate_dmg.py --self-test
          python3 contrib/macdeploy/collect_sources.py --self-test
      - name: Verify native toolchain and install dependencies
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          test "$(uname -m)" = "$EXPECTED_ARCH"
          xcodebuild -version
          clang --version
          brew install cmake make ninja pkgconf ccache
          echo "CCACHE_DIR=$RUNNER_TEMP/connectcoin-macos-ccache" >> "$GITHUB_ENV"
          echo "DEPENDS_HOST=$(cd depends && ./config.sub "$(./config.guess)")" >> "$GITHUB_ENV"
      - name: Restore pinned dependency packages
        id: depends-cache
        uses: actions/cache/restore@v5
        with:
          path: depends/built
          key: macos-depends-15-xcode16.2-${{ matrix.arch }}-${{ hashFiles('depends/**') }}
      - name: Build pinned static dependencies and retain corresponding sources
        id: depends
        run: |
          gmake -C depends -j3 NO_IPC=1 NO_USDT=1 \
            OSX_SDK="$(xcrun --show-sdk-path)" OSX_SDK_VERSION="$(xcrun --show-sdk-version)" \
            OSX_MIN_VERSION="$MACOSX_DEPLOYMENT_TARGET" XCODE_VERSION=16.2
          gmake -C depends download-one NO_IPC=1 NO_USDT=1 \
            OSX_SDK="$(xcrun --show-sdk-path)" OSX_SDK_VERSION="$(xcrun --show-sdk-version)" \
            OSX_MIN_VERSION="$MACOSX_DEPLOYMENT_TARGET" XCODE_VERSION=16.2
      - name: Save completed dependency packages
        if: ${{ steps.depends.outcome == 'success' && steps.depends-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        timeout-minutes: 3
        continue-on-error: true
        with:
          path: depends/built
          key: ${{ steps.depends-cache.outputs.cache-primary-key }}
      - name: Restore compiler cache
        id: compiler-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: macos-packages-${{ matrix.arch }}-${{ github.sha }}
          restore-keys: macos-packages-${{ matrix.arch }}-
      - name: Configure release build
        env:
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          cmake -S . -B build-macos -G Ninja \
            --toolchain "$PWD/depends/$DEPENDS_HOST/toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="$BUILD_ARCH" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$MACOSX_DEPLOYMENT_TARGET" \
            -DBUILD_GUI=ON -DBUILD_TESTS=ON -DBUILD_GUI_TESTS=ON \
            -DENABLE_IPC=OFF -DWITH_ZMQ=ON -DWITH_CCACHE=ON
      - name: Compile application and verification binaries
        id: compile
        run: |
          ccache --zero-stats
          cmake --build build-macos --target connectcoin-qt connectcoin-test connectcoin-test-desktop-icons
      - name: Compiler cache statistics
        if: ${{ (success() || failure()) && steps.compile.outcome != 'skipped' }}
        run: ccache --show-stats
      - name: Save compiler cache
        if: ${{ (success() || failure()) && steps.compile.outcome == 'success' && steps.compiler-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        timeout-minutes: 3
        continue-on-error: true
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
      - name: Core unit tests
        timeout-minutes: 20
        run: TEST_RANDOMX_MOCK_POW=1 build-macos/bin/connectcoin-test --log_level=message
      - name: Real RandomX and desktop icon tests
        timeout-minutes: 10
        run: |
          ctest --test-dir build-macos --output-on-failure \
            -R '^(pow_tests|randomx_tests|connectcoin-test-desktop-icons)$'
      - name: Build disk image
        env:
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          python3 contrib/macdeploy/collect_sources.py --repo . --build-dir build-macos \
            --output-dir build-macos/dist --version 1.0.0 --arch "$BUILD_ARCH"
          python3 contrib/macdeploy/build_dmg.py --build-dir build-macos --output-dir build-macos/dist \
            --version 1.0.0 --arch "$BUILD_ARCH" --minimum-macos "$MACOSX_DEPLOYMENT_TARGET" \
            --qt-translations "depends/$DEPENDS_HOST/translations" \
            --licenses-dir "build-macos/dist/licenses-$BUILD_ARCH"
      - name: Verify mounted and relocated installer
        timeout-minutes: 10
        env:
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          python3 contrib/macdeploy/validate_dmg.py \
            --dmg "build-macos/dist/connectcoin-core-1.0.0-macos-$BUILD_ARCH.dmg" \
            --arch "$BUILD_ARCH" --version 1.0.0 --output "build-macos/dist/verification-$BUILD_ARCH.json"
      - name: Upload installers and verification reports
        uses: actions/upload-artifact@v7
        with:
          name: connectcoin-core-1.0.0-macos-${{ matrix.arch }}
          path: |
            build-macos/dist/*.dmg
            build-macos/dist/*.json
            build-macos/dist/SHA256SUMS-*.txt
            build-macos/dist/*-sources.tar.gz
          if-no-files-found: error
          retention-days: 30
