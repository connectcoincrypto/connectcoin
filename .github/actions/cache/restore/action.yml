name: 'Restore Caches'
description: 'Restore ccache, depends sources, and built depends caches'
inputs:
  provider:
    description: 'The cache provider to use'
    required: true
runs:
  using: 'composite'
  steps:
    - name: Restore Ccache cache
      id: ccache-cache
      uses: ./.github/actions/cache/restore/internal
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ccache-${{ env.CI_CACHE_NAME }}-${{ github.run_id }}-${{ env.CONTAINER_NAME }}
        restore-keys: |
          ccache-${{ env.CI_CACHE_NAME }}-
          ccache-${{ env.CONTAINER_NAME }}-
        provider: ${{ inputs.provider }}

    - name: Restore depends sources cache
      id: depends-sources
      uses: ./.github/actions/cache/restore/internal
      # Preserve GHA storage for built packages and compiler outputs. Sources
      # are checksum-verified downloads needed only when a package must rebuild.
      if: ${{ inputs.provider != 'gha' }}
      with:
        path: ${{ env.SOURCES_PATH }}
        # Shards have different container names but identical dependencies.
        key: depends-sources-${{ env.CI_CACHE_NAME }}-${{ env.DEPENDS_HASH }}
        restore-keys: |
          depends-sources-${{ env.CI_CACHE_NAME }}-
          depends-sources-${{ env.CONTAINER_NAME }}-
        provider: ${{ inputs.provider }}

    - name: Restore built depends cache
      id: depends-built
      uses: ./.github/actions/cache/restore/internal
      with:
        path: ${{ env.BASE_CACHE }}
        key: depends-built-${{ env.CI_CACHE_NAME }}-${{ env.DEPENDS_HASH }}
        restore-keys: |
          depends-built-${{ env.CI_CACHE_NAME }}-
          depends-built-${{ env.CONTAINER_NAME }}-
        provider: ${{ inputs.provider }}

    - name: export cache hits
      shell: bash
      run: |
        echo "depends-sources-cache-hit=${{ steps.depends-sources.outputs.cache-hit }}" >> $GITHUB_ENV
        echo "depends-built-cache-hit=${{ steps.depends-built.outputs.cache-hit }}" >> $GITHUB_ENV
