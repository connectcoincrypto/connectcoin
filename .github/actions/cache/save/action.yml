name: 'Save Caches'
description: 'Save ccache, depends sources, and built depends caches'
inputs:
  provider:
    description: 'The cache provider to use'
    required: true
runs:
  using: 'composite'
  steps:
    - name: debug cache hit inputs
      if: ${{ success() || failure() }}
      shell: bash
      run: |
        echo "depends sources direct cache hit to primary key: ${{ env.depends-sources-cache-hit }}"
        echo "depends built direct cache hit to primary key: ${{ env.depends-built-cache-hit }}"

    - name: Check completed dependency build
      id: depends-status
      if: ${{ success() || failure() }}
      shell: bash
      env:
        CI_CACHE_RUN: ${{ github.run_id }}:${{ github.run_attempt }}:${{ github.job }}:${{ env.CONTAINER_NAME }}
      run: |
        complete=false
        if [[ -n "${BASE_BUILD_DIR:-}" && -f "${BASE_BUILD_DIR}/.ci-depends-complete" && ! -L "${BASE_BUILD_DIR}/.ci-depends-complete" ]] &&
           [[ "$(cat -- "${BASE_BUILD_DIR}/.ci-depends-complete")" == "$CI_CACHE_RUN" ]]; then
          complete=true
        fi
        echo "complete=$complete" >> "$GITHUB_OUTPUT"

    - name: Save Ccache cache
      uses: ./.github/actions/cache/save/internal
      # GitHub caches are branch-scoped, so branch pushes can reuse their own
      # builds. Keep other providers restricted to the default branch.
      # Fuzz shards compile identical binaries and restore a shared namespace.
      # Export once, as with Docker, to avoid four copies evicting other caches.
      if: ${{ (success() || failure()) && github.event_name == 'push' && (inputs.provider == 'gha' || github.ref_name == github.event.repository.default_branch) && (env.FUZZ_SHARD_COUNT == '' || env.FUZZ_SHARD_INDEX == '0') }}
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ccache-${{ env.CI_CACHE_NAME }}-${{ github.run_id }}-${{ env.CONTAINER_NAME }}
        provider: ${{ inputs.provider }}

    - name: Save depends sources cache
      uses: ./.github/actions/cache/save/internal
      # Per-platform source archives duplicate downloads in GHA's shared
      # storage budget. Keep built depends (including Qt) cached below instead.
      if: ${{ (success() || failure()) && inputs.provider != 'gha' && github.event_name == 'push' && (inputs.provider == 'gha' || github.ref_name == github.event.repository.default_branch) && (env.FUZZ_SHARD_COUNT == '' || env.FUZZ_SHARD_INDEX == '0') && steps.depends-status.outputs.complete == 'true' && env.depends-sources-cache-hit != 'true' }}
      with:
        path: ${{ env.SOURCES_PATH }}
        key: depends-sources-${{ env.CI_CACHE_NAME }}-${{ env.DEPENDS_HASH }}
        provider: ${{ inputs.provider }}

    - name: Save built depends cache
      uses: ./.github/actions/cache/save/internal
      if: ${{ (success() || failure()) && github.event_name == 'push' && (inputs.provider == 'gha' || github.ref_name == github.event.repository.default_branch) && (env.FUZZ_SHARD_COUNT == '' || env.FUZZ_SHARD_INDEX == '0') && steps.depends-status.outputs.complete == 'true' && env.depends-built-cache-hit != 'true' }}
      with:
        path: ${{ env.BASE_CACHE }}
        key: depends-built-${{ env.CI_CACHE_NAME }}-${{ env.DEPENDS_HASH }}
        provider: ${{ inputs.provider }}
