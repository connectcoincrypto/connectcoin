name: Issue or feature request related to the GUI
description: Any report, issue or feature request related to the GUI
labels: [GUI]
body:
- type: markdown
  attributes:
    value: |
      If you use AI tools when opening this issue, please read the [AI policy](../../doc/AI_POLICY.md).

- type: checkboxes
  id: acknowledgement
  attributes:
    label: This report concerns the ConnectCoin GUI, not the upstream Bitcoin Core GUI
    description: Submit upstream-only reports to upstream separately.
    options:
      - label: I still think this issue should be opened here
        required: true
- type: textarea
  id: gui-request
  attributes:
    label: Report
  validations:
    required: true
