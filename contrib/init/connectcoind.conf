description "ConnectCoin Daemon"

start on runlevel [2345]
stop on starting rc RUNLEVEL=[016]

env CONNECTCOIND_BIN="/usr/bin/connectcoind"
env CONNECTCOIND_USER="connectcoin"
env CONNECTCOIND_GROUP="connectcoin"
env CONNECTCOIND_PIDDIR="/var/run/connectcoind"
# upstart can't handle variables constructed with other variables
env CONNECTCOIND_PIDFILE="/var/run/connectcoind/connectcoind.pid"
env CONNECTCOIND_CONFIGFILE="/etc/connectcoin/connectcoin.conf"
env CONNECTCOIND_DATADIR="/var/lib/connectcoind"

expect fork

respawn
respawn limit 5 120
kill timeout 600

pre-start script
    configdir="$(dirname "$CONNECTCOIND_CONFIGFILE")"

    # An explicitly selected -conf file must exist. Create an empty one on the
    # first start; cookie authentication remains the secure default. The
    # daemon must not be able to replace the config path with a symlink.
    if [ -L "$configdir" ]; then
        echo "ERROR: Configuration directory must not be a symlink: $configdir"
        exit 1
    fi
    mkdir -p "$configdir"
    chown root:$CONNECTCOIND_GROUP "$configdir"
    chmod 0750 "$configdir"

    if [ -L "$CONNECTCOIND_CONFIGFILE" ] || \
       { [ -e "$CONNECTCOIND_CONFIGFILE" ] && [ ! -f "$CONNECTCOIND_CONFIGFILE" ]; }; then
        echo "ERROR: Configuration path must be a regular file, not a symlink: $CONNECTCOIND_CONFIGFILE"
        exit 1
    fi
    if [ ! -e "$CONNECTCOIND_CONFIGFILE" ]; then
        umask 0027
        : > "$CONNECTCOIND_CONFIGFILE"
    fi

    # Catch an unreadable config before forking, so Upstart does not report a
    # node as started while connectcoind is still failing initialization.
    if [ ! -r "$CONNECTCOIND_CONFIGFILE" ]; then
        echo "ERROR: Cannot read $CONNECTCOIND_CONFIGFILE"
        exit 1
    fi

    mkdir -p "$CONNECTCOIND_PIDDIR"
    chmod 0755 "$CONNECTCOIND_PIDDIR"
    chown $CONNECTCOIND_USER:$CONNECTCOIND_GROUP "$CONNECTCOIND_PIDDIR"
    mkdir -p "$CONNECTCOIND_DATADIR"
    chown $CONNECTCOIND_USER:$CONNECTCOIND_GROUP "$CONNECTCOIND_DATADIR"
    chmod 0750 "$CONNECTCOIND_DATADIR"
    chown root:$CONNECTCOIND_GROUP "$CONNECTCOIND_CONFIGFILE"
    chmod 0640 "$CONNECTCOIND_CONFIGFILE"
end script

exec start-stop-daemon \
    --start \
    --pidfile "$CONNECTCOIND_PIDFILE" \
    --chuid $CONNECTCOIND_USER:$CONNECTCOIND_GROUP \
    --exec "$CONNECTCOIND_BIN" \
    -- \
    -pid="$CONNECTCOIND_PIDFILE" \
    -conf="$CONNECTCOIND_CONFIGFILE" \
    -datadir="$CONNECTCOIND_DATADIR" \
    -disablewallet \
    -daemon
