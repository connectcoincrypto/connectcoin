# connectcoind RPC settings (linearize-hashes)
rpcuser=someuser
rpcpassword=somepassword
#datadir=~/.connectcoin/testnet4
host=127.0.0.1

# Current Testnet4 beta RPC port (not the P2P port 48179)
port=48178

#testnet3 default
#port=48175

#regtest default
#port=48184

#signet default
#port=48181

# bootstrap.dat hashlist settings (linearize-hashes)
max_height=313000

# bootstrap.dat input/output settings (linearize-data)

# Testnet4 after the P2C v2 reset. Both identifiers are required.
netmagic=4e3d8178
genesis=38cae555fb78f44c31e7d6859d0476252b321dae8b6312afefe0a45fc3fd112a
input=/home/example/.connectcoin/testnet4/blocks

# For a different chain, set its RPC port above and replace BOTH identifiers
# and the input directory. Obtain genesis from connectcoin-cli getblockhash 0,
# and netmagic from net.magic in connectcoin-util getchainparams; supply the
# same explicit -chain option to both. Mainnet has not been launched.

# "output" option causes blockchain files to be written to the given location,
# with "output_file" ignored. If not used, "output_file" is used instead.
# output=/home/example/blockchain_directory
output_file=/home/example/Downloads/bootstrap.dat
hashlist=hashlist.txt

# Maximum size in bytes of out-of-order blocks cache in memory
out_of_order_cache_sz = 100000000

# Do we want the reverse the hash bytes coming from getblockhash?
rev_hash_bytes = False

# On a new month, do we want to set the access and modify times of the new
# blockchain file?
file_timestamp = 0
# Do we want to split the blockchain files given a new month or specific height?
split_timestamp = 0

# Do we want debug printouts?
debug_output = False
